<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>جزئیات آزمون</title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/material-design-lite/1.3.0/material.indigo-pink.min.css">
     <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
     <style>
          * { box-sizing: border-box; margin: 0; padding: 0; }
          body {
               direction: rtl;
               text-align: right;
               font-family: 'Vazirmatn', Tahoma, sans-serif;
               background: linear-gradient(160deg, #eef2ff 0%, #f0f4f8 45%, #e8eaf6 100%);
               min-height: 100vh;
          }
          .mdl-card {
               max-width: 820px;
               margin: 0 auto;
               width: 100%;
               border-radius: 18px;
               overflow: hidden;
               box-shadow: 0 8px 30px rgba(26, 35, 126, 0.09);
               border: 1px solid rgba(99, 102, 241, 0.08);
          }
          .mdl-card__title {
               background: linear-gradient(90deg, #1a237e 0%, #283593 55%, #3949ab 100%);
               color: #fff;
               padding: 22px 28px;
          }
          .mdl-card__title-text { font-size: 1.4rem; font-weight: 600; }
          .mdl-card__supporting-text {
               padding: 30px;
               width: 100%;
               box-sizing: border-box;
               color: #1e293b;
          }
          .mdl-button {
               font-family: 'Vazirmatn', Tahoma, sans-serif;
               border-radius: 8px;
               font-weight: 600;
               font-size: 0.95rem;
               height: 42px;
               padding: 0 18px;
               justify-content: center;
               align-items: center;
          }
          .info-row {
               display: flex;
               padding: 12px 0;
               border-bottom: 1px solid #e2e8f0;
          }
          .info-label {
               width: 160px;
               font-weight: 600;
               color: #475569;
               flex-shrink: 0;
          }
          .info-value { flex: 1; }
          .status-badge {
               padding: 5px 14px;
               border-radius: 20px;
               font-size: 0.88rem;
               font-weight: 500;
               display: inline-block;
          }
          .status-draft { background: #fff7ed; color: #c2410c; }
          .status-active { background: #ecfdf5; color: #047857; }
          .status-ongoing { background: #fefce8; color: #a16207; }
          .status-ended { background: #fef2f2; color: #b91c1c; }
          .status-unknown { background: #f1f5f9; color: #475569; }
          .btn-group {
               display: flex;
               gap: 12px;
               flex-wrap: wrap;
               margin-top: 28px;
          }
          .btn-publish { background: #059669 !important; color: white !important; }
          .btn-unpublish { background: #d97706 !important; color: white !important; }
          .btn-delete { background: #dc2626 !important; color: white !important; }
          .btn-take { background: #2563eb !important; color: white !important; }
          .btn-take-disabled {
               background: #e2e8f0 !important;
               color: #94a3b8 !important;
               pointer-events: none;
          }
          #opBtn {
               margin-top: 20px;
               display: flex;
               gap: 12px;
               flex-wrap: wrap;
          }
          @media (max-width: 600px) {
               .info-row { flex-direction: column; gap: 4px; }
               .info-label { width: 100%; }
               .mdl-card__supporting-text { padding: 22px 18px; }
          }
     </style>
</head>
<body>
     <div class="mdl-grid">
          <div class="mdl-cell mdl-cell--12-col">
               <div class="mdl-card mdl-shadow--2dp">
                    <div class="mdl-card__title">
                         <p class="mdl-card__title-text" style="font-size: larger;" id="exam-title">جزئیات آزمون</p>
                    </div>
                    <div class="mdl-card__supporting-text">
                         <div id="exam-info"></div>
                         <div class="btn-group" id="action-buttons"></div>
                         <div id="opBtn"></div>
                    </div>
               </div>
          </div>
     </div>

     <div id="exam-data" data-exam='{{ exam_json }}' data-base-url='{{ base_url }}' data-user-role='{{ user_role }}'></div>

     <script>
          (function() {
               var dataElement = document.getElementById('exam-data');
               var exam = JSON.parse(dataElement.getAttribute('data-exam') || 'null');
               var baseUrl = dataElement.getAttribute('data-base-url') || '';
               var userRole = dataElement.getAttribute('data-user-role') || '';

               if (!exam) {
                    document.getElementById('exam-title').textContent = 'آزمون یافت نشد';
                    return;
               }

               function renderExamInfo() {
                    var container = document.getElementById('exam-info');
                    var statusText = exam.exam_status || 'نامشخص';
                    var statusClass = exam.status_class || 'status-unknown';
                    var teacherName = exam.teacher_name || 'نامشخص';

                    var html = '';
                    html += '<div class="info-row"><span class="info-label">عنوان:</span><span class="info-value">' + (exam.title || '') + '</span></div>';
                    html += '<div class="info-row"><span class="info-label">استاد:</span><span class="info-value">' + teacherName + '</span></div>';
                    html += '<div class="info-row"><span class="info-label">توضیحات:</span><span class="info-value">' + (exam.description || '') + '</span></div>';
                    html += '<div class="info-row"><span class="info-label">تاریخ و زمان برگزاری:</span><span class="info-value">' + ((exam.start_time || '—').replace('T', ' | ') || '') + '</span></div>';
                    html += '<div class="info-row"><span class="info-label">مدت زمان:</span><span class="info-value">' + (exam.duration || 0) + ' دقیقه</span></div>';
                    html += '<div class="info-row"><span class="info-label">نمره کل:</span><span class="info-value">' + (exam.total_score || 0) + '</span></div>';
                    html += '<div class="info-row"><span class="info-label">تعداد سوالات:</span><span class="info-value">' + (exam.total_questions || 0) + '</span></div>';
                    html += '<div class="info-row"><span class="info-label">وضعیت:</span><span class="info-value"><span class="status-badge ' + statusClass + '">' + statusText + '</span></span></div>';
                    container.innerHTML = html;
                    document.getElementById('exam-title').textContent = 'جزئیات آزمون: ' + (exam.title || '');
               }

               function renderActions() {
                    var container = document.getElementById('action-buttons');
                    var html = '';

                    if (userRole === 'admin' || userRole === 'teacher') {
                         html += '<a href="' + baseUrl + '/exam/edit/' + exam.id + '" class="mdl-button mdl-js-button mdl-button--raised mdl-button--colored">ویرایش</a>';

                         if (exam.exam_status === 'پیش‌نویس') {
                         html += '<form method="POST" action="' + baseUrl + '/exam/publish/' + exam.id + '" style="display:inline;" onsubmit="return confirm(\'آیا از فعال کردن این آزمون اطمینان دارید؟\');">';
                         html += '<button type="submit" class="mdl-button mdl-js-button mdl-button--raised btn-publish">فعال کردن</button>';
                         html += '</form>';
                         } else if (exam.exam_status === 'فعال' || exam.exam_status === 'در حال برگزاری') {
                         html += '<form method="POST" action="' + baseUrl + '/exam/unpublish/' + exam.id + '" style="display:inline;" onsubmit="return confirm(\'آیا از غیرفعال کردن این آزمون اطمینان دارید؟\');">';
                         html += '<button type="submit" class="mdl-button mdl-js-button mdl-button--raised btn-unpublish">غیرفعال کردن</button>';
                         html += '</form>';
                         }

                         html += '<form method="POST" action="' + baseUrl + '/exam/delete/' + exam.id + '" style="display:inline;" onsubmit="return confirm(\'آیا از حذف این آزمون اطمینان دارید؟\');">';
                         html += '<button type="submit" class="mdl-button mdl-js-button mdl-button--raised btn-delete">حذف</button>';
                         html += '</form>';
                    } else if (userRole === 'student') {
                         if (exam.exam_status === 'در حال برگزاری') {
                         html += '<a href="' + baseUrl + '/exam/take/' + exam.id + '" class="mdl-button mdl-js-button mdl-button--raised btn-take">شرکت در آزمون</a>';
                         } else if (exam.exam_status === 'فعال') {
                         html += '<button class="mdl-button mdl-js-button mdl-button--raised btn-take-disabled" disabled>غیرفعال تا شروع آزمون</button>';
                         }
                    }

                    container.innerHTML = html;
               }

               function renderBottomButtons() {
                    var container = document.getElementById('opBtn');
                    if (!container) return;
                    var btn = '';
                    btn += '<a href="' + baseUrl + '/exams" class="mdl-button mdl-js-button mdl-button--raised">بازگشت به لیست</a>';
                    if (exam.exam_status === "به پایان رسیده") btn += '<a href="' + baseUrl + '/exam/feedback/' + exam.id + '" class="mdl-button mdl-js-button mdl-button--raised" style="background:#059669;color:white;">نتیجه آزمون</a>';

                    container.innerHTML = btn;
               }

               window.onload = function() {
                    renderExamInfo();
                    renderActions();
                    renderBottomButtons();
                    if (window.componentHandler) {
                         window.componentHandler.upgradeAllRegistered();
                    }
               };
          })();
     </script>
     <script defer src="https://cdnjs.cloudflare.com/ajax/libs/material-design-lite/1.3.0/material.min.js"></script>
</body>
</html>
