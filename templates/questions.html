<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>بانک سوالات</title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/material-design-lite/1.3.0/material.indigo-pink.min.css">
     <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
     <style>
          * { box-sizing: border-box; margin: 0; padding: 0; }
          html, body {
               direction: rtl; text-align: right;
               font-family: 'Vazirmatn', Tahoma, sans-serif;
               background: linear-gradient(160deg, #eef2ff 0%, #f0f4f8 45%, #e8eaf6 100%);
               min-height: 100vh;
          }
          .mdl-grid { max-width: 1100px; padding: 16px 12px; margin: 0 auto; }
          .mdl-card {
               width: 100%;
               border-radius: 14px;
               overflow: hidden;
               box-shadow: 0 6px 24px rgba(26, 35, 126, 0.08);
               border: 1px solid rgba(99, 102, 241, 0.08);
               background: #fff;
          }
          .mdl-card__title {
               background: linear-gradient(90deg, #1a237e 0%, #283593 55%, #3949ab 100%);
               color: #fff;
               padding: 16px 22px;
          }
          .mdl-card__title-text { font-size: 1.25rem; font-weight: 600; }
          .mdl-card__supporting-text {
               padding: 20px 22px;
               width: 100%;
               box-sizing: border-box;
          }
          .header-actions {
               display: flex;
               gap: 10px;
               flex-wrap: wrap;
               align-items: center;
               margin-bottom: 18px;
          }
          .table-container {
               overflow-x: auto;
               border-radius: 10px;
               border: 1px solid #e2e8f0;
          }
          table {
               width: 100%;
               border-collapse: collapse;
               background: #fff;
          }
          th, td {
               padding: 11px 14px;
               text-align: right;
               border-bottom: 1px solid #e2e8f0;
               font-size: 0.92rem;
          }
          th {
               background: #f1f5f9;
               font-weight: 600;
               color: #334155;
          }
          td { color: #1e293b; }
          tr:hover td { background: #f8fafc; }
          .btn-icon { color: #3949ab; }
          .btn-delete { color: #dc2626; }
          .mdl-button {
               font-family: 'Vazirmatn', Tahoma, sans-serif;
               border-radius: 8px;
               font-weight: 600;
          }
          @media (max-width: 600px) {
               th, td { padding: 8px 10px; font-size: 0.85rem; }
               .mdl-card__supporting-text { padding: 16px; }
          }
     </style>
</head>
<body>
     <div class="mdl-grid">
          <div class="mdl-cell mdl-cell--12-col">
               <div class="mdl-card mdl-shadow--2dp">
                    <div class="mdl-card__title">
                         <p class="mdl-card__title-text" style="font-size: larger;">بانک سوالات</p>
                    </div>
                    <div class="mdl-card__supporting-text">
                         <div class="header-actions">
                         <a href="{{ base_url }}/question/add" class="mdl-button mdl-js-button mdl-button--raised mdl-button--colored">سوال جدید</a>
                         </div>
                         <div class="table-container">
                         <table>
                              <thead>
                                   <tr>
                                        <th>متن سوال</th>
                                        <th>نوع</th>
                                        <th>نمره</th>
                                        <th>عملیات</th>
                                   </tr>
                              </thead>
                              <tbody id="questions-tbody">
                                   <tr><td colspan="4" style="text-align:center;">در حال بارگذاری...</td></tr>
                              </tbody>
                         </table>
                         </div>
                    </div>
               </div>
          </div>
     </div>

     <div id="questions-data" data-questions='{{ questions_json }}' data-base-url='{{ base_url }}'></div>

     <script>
          (function() {
               var dataEl = document.getElementById('questions-data');
               var questions = JSON.parse(dataEl.getAttribute('data-questions') || '[]');
               var baseUrl = dataEl.getAttribute('data-base-url') || '';

               function renderQuestions(questions) {
                    var tbody = document.getElementById('questions-tbody');
                    if (!tbody) return;
                    if (questions.length === 0) {
                         tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#64748b;">هیچ سوالی یافت نشد</td></tr>';
                         return;
                    }
                    var html = '';
                    for (var i = 0; i < questions.length; i++) {
                         var q = questions[i];
                         var typeText = '';
                         if (q.question_type === 'true_false') {
                         typeText = 'صحیح / غلط';
                         } else if (q.question_type === 'single') {
                         typeText = 'چند گزینه‌ای (یک پاسخ)';
                         } else if (q.question_type === 'multiple') {
                         typeText = 'چند گزینه‌ای (چند پاسخ)';
                         } else {
                         typeText = q.question_type || 'نامشخص';
                         }
                         html += '<tr>';
                         html += '<td>' + (q.question_text || '') + '</td>';
                         html += '<td>' + typeText + '</td>';
                         html += '<td>' + (q.score || 0) + '</td>';
                         html += '<td style="white-space:nowrap;">';
                         html += '<a href="' + baseUrl + '/question/edit/' + q.id + '" class="mdl-button mdl-js-button mdl-button--icon btn-icon" title="ویرایش"><i class="material-icons">edit</i></a>';
                         html += '<form method="POST" action="' + baseUrl + '/question/delete/' + q.id + '" style="display:inline;" onsubmit="return confirm(\'آیا از حذف این سوال اطمینان دارید؟\');">';
                         html += '<button type="submit" class="mdl-button mdl-js-button mdl-button--icon btn-delete" title="حذف"><i class="material-icons">delete</i></button>';
                         html += '</form>';
                         html += '</td>';
                         html += '</tr>';
                    }
                    tbody.innerHTML = html;
                    if (window.componentHandler) {
                         window.componentHandler.upgradeAllRegistered();
                    }
               }

               window.onload = function() {
                    renderQuestions(questions);
               };
          })();
     </script>
     <script defer src="https://cdnjs.cloudflare.com/ajax/libs/material-design-lite/1.3.0/material.min.js"></script>
</body>
</html>
