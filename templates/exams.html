<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>لیست آزمون‌ها</title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/material-design-lite/1.3.0/material.indigo-pink.min.css">
     <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
     <style>
          * { box-sizing: border-box; margin: 0; padding: 0; }
          html, body {
               width: 100%; max-width: 100%;
               direction: rtl; text-align: right;
               font-family: 'Vazirmatn', Tahoma, sans-serif;
               background: linear-gradient(160deg, #eef2ff 0%, #f0f4f8 45%, #e8eaf6 100%);
               min-height: 100vh;
          }
          .mdl-grid { max-width: 1200px; padding: 28px 16px; margin: 0 auto; }
          .mdl-card {
               width: 100%;
               border-radius: 18px;
               overflow: hidden;
               box-shadow: 0 8px 30px rgba(26, 35, 126, 0.09);
               border: 1px solid rgba(99, 102, 241, 0.08);
               background: #ffffff;
          }
          .mdl-card__title {
               background: linear-gradient(90deg, #1a237e 0%, #283593 55%, #3949ab 100%);
               color: #fff;
               padding: 22px 28px;
          }
          .mdl-card__title-text { font-size: 1.45rem; font-weight: 600; }
          .mdl-card__supporting-text {
               padding: 28px;
               width: 100%;
               box-sizing: border-box;
          }
          .mdl-button {
               font-family: 'Vazirmatn', Tahoma, sans-serif;
               border-radius: 8px;
               font-weight: 600;
               font-size: 0.95rem;
               height: 42px;
               padding: 0 18px;
          }
          .header-actions {
               display: flex;
               gap: 12px;
               flex-wrap: wrap;
               align-items: center;
               margin-bottom: 22px;
          }
          .table-container {
               width: 100%;
               overflow-x: auto;
               -webkit-overflow-scrolling: touch;
               border-radius: 12px;
               border: 1px solid #e2e8f0;
          }
          table {
               width: 100%;
               min-width: 700px;
               border-collapse: collapse;
               background: #fff;
          }
          th, td {
               padding: 14px 16px;
               text-align: right;
               border-bottom: 1px solid #e2e8f0;
          }
          th {
               background: #f1f5f9;
               font-weight: 600;
               color: #334155;
               font-size: 0.92rem;
          }
          td { color: #1e293b; font-size: 0.95rem; }
          tr:hover td { background: #f8fafc; }
          .status-badge {
               padding: 5px 14px;
               border-radius: 20px;
               font-size: 0.82rem;
               font-weight: 500;
               display: inline-block;
          }
          .status-draft { background: #fff7ed; color: #c2410c; }
          .status-active { background: #ecfdf5; color: #047857; }
          .status-ongoing { background: #fefce8; color: #a16207; }
          .status-ended { background: #fef2f2; color: #b91c1c; }
          .status-unknown { background: #f1f5f9; color: #475569; }
          .btn-icon { color: #3949ab; }
          .btn-delete { color: #dc2626; }
          .btn-take { color: #059669; }
          .btn-disabled { color: #94a3b8; pointer-events: none; cursor: default; }
          .btn-view { color: #2563eb; }
          .mdl-button--icon { min-width: 40px; }
          @media (max-width: 768px) {
               .mdl-grid { padding: 18px 12px; }
               .mdl-card__supporting-text { padding: 18px; }
               table { min-width: 600px; }
               th, td { padding: 10px 12px; font-size: 0.88rem; }
          }
     </style>
</head>
<body>
     <div class="mdl-grid">
          <div class="mdl-cell mdl-cell--12-col">
               <div class="mdl-card mdl-shadow--2dp">
                    <div class="mdl-card__title">
                         <p class="mdl-card__title-text" style="font-size: larger;">لیست آزمون‌ها</p>
                    </div>
                    <div class="mdl-card__supporting-text">
                         <div class="header-actions" id="header-actions"></div>
                         <div class="table-container">
                         <table>
                              <thead>
                                   <tr>
                                        <th>عنوان</th>
                                        <th>استاد</th>
                                        <th>تاریخ و زمان شروع</th>
                                        <th>زمان (دقیقه)</th>
                                        <th>وضعیت</th>
                                        <th>عملیات</th>
                                   </tr>
                              </thead>
                              <tbody id="exams-tbody">
                                   <tr><td colspan="6" style="text-align:center;">در حال بارگذاری...</td></tr>
                              </tbody>
                         </table>
                         </div>
                    </div>
               </div>
          </div>
     </div>

     <script>
          var examsDataStr = '{{ exams_json }}';
          var baseUrl = '{{ base_url }}';
          var userRole = '{{ user_role }}';
          var exams = JSON.parse(examsDataStr);

          function renderHeader() {
               var container = document.getElementById('header-actions');
               if (!container) return;
               var html = '';
               if (userRole === 'admin' || userRole === 'teacher') {
                    html += '<a href="' + baseUrl + '/exam/add" class="mdl-button mdl-js-button mdl-button--raised mdl-button--colored">ساخت آزمون جدید</a>';
               }
               container.innerHTML = html;
          }

          function renderTable(exams) {
               var tbody = document.getElementById('exams-tbody');
               if (!tbody) return;
               if (exams.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#64748b;">هیچ آزمونی یافت نشد</td></tr>';
                    return;
               }
               var html = '';
               for (var i = 0; i < exams.length; i++) {
                    var e = exams[i];
                    var statusText = e.exam_status || 'نامشخص';
                    var statusClass = e.status_class || 'status-unknown';
                    var teacherName = e.teacher_name || 'نامشخص';
                    var startTime = (e.start_time || '—').replace('T', ' | ');

                    html += '<tr>';
                    html += '<td title="' + (e.title || '') + '">' + (e.title || '') + '</td>';
                    html += '<td title="' + teacherName + '">' + teacherName + '</td>';
                    html += '<td>' + startTime + '</td>';
                    html += '<td>' + (e.duration || 0) + '</td>';
                    html += '<td><span class="status-badge ' + statusClass + '" style="text-align:center;">' + statusText + '</span></td>';
                    html += '<td style="white-space:nowrap;">';
                    if (userRole === 'admin' || userRole === 'teacher') {
                         html += '<a href="' + baseUrl + '/exam/' + e.id + '" class="mdl-button mdl-js-button mdl-button--icon btn-icon" title="مشاهده"><i class="material-icons">visibility</i></a>';
                         html += '<a href="' + baseUrl + '/exam/edit/' + e.id + '" class="mdl-button mdl-js-button mdl-button--icon btn-icon" title="ویرایش"><i class="material-icons">edit</i></a>';
                         html += '<a href="' + baseUrl + '/exam/results/' + e.id + '" class="mdl-button mdl-js-button mdl-button--icon btn-icon" title="نتایج"><i class="material-icons">assessment</i></a>';
                         html += '<form method="POST" action="' + baseUrl + '/exam/delete/' + e.id + '" style="display:inline;" onsubmit="return confirm(\'آیا از حذف این آزمون اطمینان دارید؟\');">';
                         html += '<button type="submit" class="mdl-button mdl-js-button mdl-button--icon btn-delete" title="حذف"><i class="material-icons">delete</i></button>';
                         html += '</form>';
                    } else if (userRole === 'student') {
                         html += '<a href="' + baseUrl + '/exam/' + e.id + '" class="mdl-button mdl-js-button mdl-button--icon btn-view" title="مشاهده"><i class="material-icons">visibility</i></a>';
                         if (e.exam_status === 'در حال برگزاری') {
                         html += '<a href="' + baseUrl + '/exam/take/' + e.id + '" class="mdl-button mdl-js-button mdl-button--icon btn-take" title="شرکت در آزمون"><i class="material-icons">play_arrow</i></a>';
                         } else {
                         html += '<span class="mdl-button mdl-js-button mdl-button--icon btn-disabled" title="غیرفعال"><i class="material-icons">play_arrow</i></span>';
                         }
                    }
                    html += '</td>';
                    html += '</tr>';
               }
               tbody.innerHTML = html;
          }

          window.onload = function() {
               renderHeader();
               renderTable(exams);
               if (window.componentHandler) {
                    window.componentHandler.upgradeAllRegistered();
               }
          };
     </script>
     <script defer src="https://cdnjs.cloudflare.com/ajax/libs/material-design-lite/1.3.0/material.min.js"></script>
</body>
</html>
