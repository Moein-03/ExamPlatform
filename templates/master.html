<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title id="page-title">پلتفرم آزمون آنلاین</title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/material-design-lite/1.3.0/material.indigo-pink.min.css">
     <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
     <style>
          * { box-sizing: border-box; margin: 0; padding: 0; }
          body {
               font-family: 'Vazirmatn', Tahoma, sans-serif;
               background: linear-gradient(160deg, #eef2ff 0%, #f0f4f8 45%, #e8eaf6 100%);
               min-height: 100vh;
               direction: rtl;
               color: #1e293b;
          }
          .page-header {
               background: linear-gradient(90deg, #1a237e 0%, #283593 50%, #3949ab 100%);
               color: white;
               padding: 0;
               box-shadow: 0 4px 20px rgba(26, 35, 126, 0.25);
               position: sticky;
               top: 0;
               z-index: 100;
          }
          .page-header .container {
               max-width: 1200px;
               margin: 0 auto;
               padding: 16px 24px;
               display: flex;
               justify-content: space-between;
               align-items: center;
          }
          .page-header h1 {
               margin: 0;
               font-size: 1.45rem;
               font-weight: 600;
               letter-spacing: -0.3px;
               display: flex;
               align-items: center;
               gap: 10px;
          }
          .page-header h1 .material-icons {
               font-size: 28px;
               opacity: 0.95;
          }
          .page-header nav a {
               color: rgba(255,255,255,0.92);
               text-decoration: none;
               margin: 0 14px;
               font-weight: 500;
               font-size: 0.95rem;
               transition: color 0.2s;
               display: inline-flex;
               align-items: center;
               gap: 6px;
          }
          .page-header nav a:hover {
               color: #fff;
          }
          .page-header nav a .material-icons {
               font-size: 18px;
          }
          main.container {
               max-width: 1200px;
               margin: 0 auto;
               padding: 28px 20px 40px;
          }
          .content {
               background: #ffffff;
               padding: 32px;
               border-radius: 18px;
               box-shadow: 0 8px 30px rgba(26, 35, 126, 0.08);
               border: 1px solid rgba(99, 102, 241, 0.08);
          }
          .hidden { display: none !important; }

          @media (max-width: 768px) {
               .page-header .container {
                    flex-direction: column;
                    gap: 14px;
                    padding: 14px 16px;
               }
               .page-header h1 { font-size: 1.25rem; }
               .page-header nav {
                    display: flex;
                    gap: 8px;
                    flex-wrap: wrap;
                    justify-content: center;
               }
               .page-header nav a { margin: 0 8px; font-size: 0.9rem; }
               main.container { padding: 20px 12px 32px; }
               .content { padding: 22px 18px; border-radius: 14px; }
          }
     </style>
</head>
<body>
     <header class="page-header">
          <div class="container">
               <p style="font-size: larger;">
                    <i class="material-icons">school</i>
                    پلتفرم آزمون آنلاین
               </p>
               <nav id="main-nav">
                    <a href="#" data-link="{{ base_url }}/dashboard">
                         <i class="material-icons">dashboard</i>
                         داشبورد
                    </a>
                    <a href="#" data-link="{{ base_url }}/logout">
                         <i class="material-icons">logout</i>
                         خروج
                    </a>
               </nav>
          </div>
     </header>
     <main class="container">
          <div class="content" id="main-content">{{ content }}</div>
     </main>

     <script src="https://cdnjs.cloudflare.com/ajax/libs/material-design-lite/1.3.0/material.min.js"></script>
     <script>
          (function() {
               var base_url = window.__DATA__ && window.__DATA__.base_url ? window.__DATA__.base_url : '';

               var navLinks = document.querySelectorAll('#main-nav a[data-link]');
               for (var i = 0; i < navLinks.length; i++) {
                    var link = navLinks[i];
                    var path = link.getAttribute('data-link');
                    if (path) {
                         link.href = base_url + path;
                    }
               }

               if (window.__DATA__ && window.__DATA__.title) {
                    document.getElementById('page-title').textContent = window.__DATA__.title + ' | سامانه آزمون‌ها';
               }
          })();
     </script>
</body>
</html>
