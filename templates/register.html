<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>ثبت نام</title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/material-design-lite/1.3.0/material.indigo-pink.min.css">
     <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
     <style>
          * { box-sizing: border-box; margin: 0; padding: 0; }
          body {
               font-family: 'Vazirmatn', Tahoma, sans-serif;
               background: linear-gradient(160deg, #1a237e 0%, #283593 45%, #3949ab 100%);
               min-height: 100vh;
               direction: rtl;
          }
          .main-container {
               display: flex;
               align-items: center;
               justify-content: center;
               min-height: 100vh;
               padding: 24px 16px;
          }
          .mdl-card {
               width: 100%;
               max-width: 460px;
               border-radius: 18px;
               overflow: hidden;
               box-shadow: 0 16px 40px rgba(0, 0, 0, 0.22);
          }
          .card-header {
               background: linear-gradient(90deg, #1a237e, #3949ab);
               color: white;
               padding: 32px 28px;
               text-align: center;
          }
          .card-header .material-icons {
               font-size: 44px;
               margin-bottom: 8px;
          }
          .card-header h2 {
               margin: 0;
               font-size: 1.65rem;
               font-weight: 600;
          }
          .form-content {
               padding: 32px 32px 36px;
               background: #ffffff;
          }
          .mdl-textfield {
               width: 100%;
               margin-bottom: 6px;
          }
          .mdl-textfield__input,
          select.mdl-textfield__input {
               font-family: 'Vazirmatn', Tahoma, sans-serif !important;
          }
          .mdl-button {
               width: 100%;
               height: 52px;
               font-size: 1.05rem;
               font-weight: 600;
               border-radius: 12px;
               font-family: 'Vazirmatn', Tahoma, sans-serif;
               background: linear-gradient(90deg, #1a237e, #3949ab) !important;
               margin-top: 16px;
          }
          .login-link {
               text-align: center;
               margin-top: 24px;
          }
          .login-link a {
               color: #3949ab;
               text-decoration: none;
               font-weight: 500;
          }
          .login-link a:hover {
               text-decoration: underline;
          }
          @media (max-width: 480px) {
               .form-content { padding: 26px 20px 30px; }
               .card-header { padding: 26px 20px; }
          }
     </style>
</head>
<body>
     <div class="main-container">
          <div class="mdl-card mdl-shadow--6dp">
               <div class="card-header">
                    <i class="material-icons">person_add</i>
                    <p style="font-size: larger;">ثبت نام</p>
               </div>
               <div class="form-content">
                    <form method="POST" action="{{ base_url }}/register" id="register-form">
                         <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
                         <input class="mdl-textfield__input" type="text" name="fullname" required>
                         <label class="mdl-textfield__label">نام کامل</label>
                         </div>

                         <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
                         <input class="mdl-textfield__input" type="email" name="email" required>
                         <label class="mdl-textfield__label">ایمیل</label>
                         </div>

                         <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
                         <input class="mdl-textfield__input" type="password" name="password" required>
                         <label class="mdl-textfield__label">رمز عبور</label>
                         </div>

                         <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
                         <select class="mdl-textfield__input" name="role">
                              <option value="student">دانشجو</option>
                              <option value="teacher">استاد</option>
                         </select>
                         <label class="mdl-textfield__label">نقش</label>
                         </div>

                         <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
                         <input class="mdl-textfield__input" type="text" name="university_id">
                         <label class="mdl-textfield__label">شماره دانشجویی / پرسنلی (اختیاری)</label>
                         </div>

                         <button type="submit" class="mdl-button mdl-js-button mdl-button--raised mdl-button--colored">
                         ثبت نام
                         </button>
                    </form>

                    <p class="login-link">
                         <a href="#" data-link="{{ base_url }}/login">
                         قبلاً ثبت نام کرده‌اید؟ ورود
                         </a>
                    </p>
               </div>
          </div>
     </div>

     <script>
          (function() {
               var base_url = window.__DATA__ ? window.__DATA__.base_url : '';
               var links = document.querySelectorAll('[data-link]');
               links.forEach(link => {
                    var path = link.getAttribute('data-link');
                    if (path) link.href = base_url + path;
               });
          })();
     </script>
     <script defer src="https://cdnjs.cloudflare.com/ajax/libs/material-design-lite/1.3.0/material.min.js"></script>
</body>
</html>
