<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>نتایج آزمون</title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/material-design-lite/1.3.0/material.indigo-pink.min.css">
     <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
     <style>
          * { box-sizing: border-box; margin: 0; padding: 0; }
          body {
               direction: rtl;
               text-align: right;
               font-family: 'Vazirmatn', Tahoma, sans-serif;
               background: linear-gradient(160deg, #eef2ff 0%, #f0f4f8 45%, #e8eaf6 100%);
               min-height: 100vh;
          }
          .mdl-card {
               max-width: 960px;
               margin: 0 auto;
               width: 100%;
               border-radius: 14px;
               overflow: hidden;
               box-shadow: 0 6px 24px rgba(26, 35, 126, 0.08);
               border: 1px solid rgba(99, 102, 241, 0.08);
          }
          .mdl-card__title {
               background: linear-gradient(90deg, #1a237e 0%, #283593 55%, #3949ab 100%);
               color: #fff;
               padding: 16px 22px;
          }
          .mdl-card__title-text { font-size: 1.25rem; font-weight: 600; }
          .mdl-card__supporting-text {
               padding: 22px 24px;
               width: 100%;
               box-sizing: border-box;
               color: #1e293b;
          }
          .stat-box {
               padding: 18px 12px;
               text-align: center;
               background: #f8fafc;
               border-radius: 12px;
               height: 100%;
               box-shadow: 0 2px 8px rgba(0,0,0,0.04);
               border: 1px solid #e2e8f0;
          }
          .stat-box .number {
               font-size: 1.9rem;
               font-weight: 700;
               color: #1a237e;
          }
          .stat-box .label {
               font-size: 0.85rem;
               color: #64748b;
               margin-top: 4px;
          }
          .table-container {
               overflow-x: auto;
               margin-top: 20px;
               border-radius: 10px;
               border: 1px solid #e2e8f0;
          }
          table {
               width: 100%;
               border-collapse: collapse;
               background: #fff;
          }
          th, td {
               padding: 11px 14px;
               text-align: right;
               border-bottom: 1px solid #e2e8f0;
               font-size: 0.92rem;
          }
          th {
               background: #f1f5f9;
               font-weight: 600;
               color: #334155;
          }
          .status-badge {
               padding: 4px 12px;
               border-radius: 20px;
               font-size: 0.8rem;
               font-weight: 500;
               display: inline-block;
          }
          .status-passed { background: #ecfdf5; color: #047857; }
          .status-failed { background: #fef2f2; color: #b91c1c; }
          .score-high { color: #047857; font-weight: 600; }
          .score-low { color: #b91c1c; font-weight: 600; }
          .score-medium { color: #d97706; font-weight: 600; }
          .mdl-button {
               font-family: 'Vazirmatn', Tahoma, sans-serif;
               border-radius: 8px;
               font-weight: 600;
          }
          @media (max-width: 600px) {
               .stat-box .number { font-size: 1.5rem; }
               th, td { padding: 8px 10px; font-size: 0.85rem; }
               .mdl-card__supporting-text { padding: 18px 16px; }
          }
     </style>
</head>
<body>
     <div class="mdl-grid">
          <div class="mdl-cell mdl-cell--12-col">
               <div class="mdl-card mdl-shadow--2dp">
                    <div class="mdl-card__title">
                         <p class="mdl-card__title-text" style="font-size: larger;">نتایج آزمون</p>
                    </div>
                    <div class="mdl-card__supporting-text">
                         <div class="mdl-grid" id="stats-container"></div>

                         <p style="margin-top: 22px; font-size: 1.1rem;">لیست دانشجویان شرکت‌کننده</p>
                         <div class="table-container">
                         <table>
                              <thead>
                                   <tr>
                                        <th>#</th>
                                        <th>نام</th>
                                        <th>ایمیل</th>
                                        <th>نمره</th>
                                        <th>وضعیت</th>
                                   </tr>
                              </thead>
                              <tbody id="results-tbody">
                                   <tr><td colspan="5" style="text-align:center;">در حال بارگذاری...</td></tr>
                              </tbody>
                         </table>
                         </div>

                         <div style="margin-top: 20px;">
                         <a href="{{ base_url }}/exams" class="mdl-button mdl-js-button mdl-button--raised">بازگشت به لیست</a>
                         </div>
                    </div>
               </div>
          </div>
     </div>

     <div id="exam-data" 
          data-results='{{ results_json }}' 
          data-stats='{{ stats_json }}'
          data-base-url='{{ base_url }}'>
     </div>

     <script>
          (function() {
               var dataElement = document.getElementById('exam-data');
               var results = JSON.parse(dataElement.getAttribute('data-results') || '[]');
               var stats = JSON.parse(dataElement.getAttribute('data-stats') || '{}');
               var baseUrl = dataElement.getAttribute('data-base-url') || '';

               function renderStats() {
                    var container = document.getElementById('stats-container');
                    if (!container) return;

                    var html = '';
                    var statsItems = [
                         { label: 'تعداد شرکت‌کنندگان', value: stats.total_participants || 0},
                         { label: 'میانگین نمرات', value: stats.avg_score || 0},
                         { label: 'بالاترین نمره', value: stats.max_score || 0},
                         { label: 'پایین‌ترین نمره', value: stats.min_score || 0}
                    ];

                    for (var i = 0; i < statsItems.length; i++) {
                         var item = statsItems[i];
                         html += '<div class="mdl-cell mdl-cell--3-col">';
                         html += '<div class="stat-box">';
                         html += '<div class="number">' + item.value + '</div>';
                         html += '<div class="label">' + item.label + '</div>';
                         html += '</div>';
                         html += '</div>';
                    }

                    container.innerHTML = html;
               }

               function renderResults() {
                    var tbody = document.getElementById('results-tbody');
                    if (!tbody) return;

                    if (!results || results.length === 0) {
                         tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#64748b;">هیچ دانشجویی در این آزمون شرکت نکرده است.</td></tr>';
                         return;
                    }

                    var html = '';
                    for (var i = 0; i < results.length; i++) {
                         var r = results[i];
                         var rowNum = i + 1;
                         var score = r.score || 0;

                         var scoreClass = 'score-medium';
                         if (score >= 70) scoreClass = 'score-high';
                         else if (score < 40) scoreClass = 'score-low';

                         var passedText = (score >= 50) ? 'قبول' : 'مردود';
                         var passedClass = (score >= 50) ? 'status-passed' : 'status-failed';

                         html += '<tr>';
                         html += '<td>' + rowNum + '</td>';
                         html += '<td>' + (r.fullname || 'نامشخص') + '</td>';
                         html += '<td>' + (r.email || '') + '</td>';
                         html += '<td><span class="' + scoreClass + '">' + score + '</span></td>';
                         html += '<td><span class="status-badge ' + passedClass + '">' + passedText + '</span></td>';
                         html += '</tr>';
                    }
                    tbody.innerHTML = html;
               }

               window.onload = function() {
                    renderStats();
                    renderResults();
                    if (window.componentHandler) {
                         window.componentHandler.upgradeAllRegistered();
                    }
               };
          })();
     </script>
     <script defer src="https://cdnjs.cloudflare.com/ajax/libs/material-design-lite/1.3.0/material.min.js"></script>
</body>
</html>
