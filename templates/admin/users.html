<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>مدیریت کاربران</title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/material-design-lite/1.3.0/material.indigo-pink.min.css">
     <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
     <style>
          * { box-sizing: border-box; margin: 0; padding: 0; }
          body {
               direction: rtl; text-align: right;
               font-family: 'Vazirmatn', Tahoma, sans-serif;
               background: linear-gradient(160deg, #eef2ff 0%, #f0f4f8 45%, #e8eaf6 100%);
               min-height: 100vh;
          }
          .mdl-card {
               max-width: 1000px;
               margin: 0 auto;
               width: 100%;
               border-radius: 14px;
               overflow: hidden;
               box-shadow: 0 6px 24px rgba(26, 35, 126, 0.08);
               border: 1px solid rgba(99, 102, 241, 0.08);
          }
          .mdl-card__title {
               background: linear-gradient(90deg, #1a237e 0%, #283593 55%, #3949ab 100%);
               color: #fff;
               padding: 16px 22px;
          }
          .mdl-card__title-text { font-size: 1.25rem; font-weight: 600; }
          .mdl-card__supporting-text {
               padding: 20px 22px;
               width: 100%;
               box-sizing: border-box;
          }
          .header-actions {
               display: flex;
               gap: 10px;
               flex-wrap: wrap;
               align-items: center;
               margin-bottom: 16px;
               color: #475569;
               font-size: 0.95rem;
          }
          .search-box {
               margin-bottom: 16px;
          }
          .search-box input {
               width: 100%;
               padding: 10px 14px;
               border: 1.5px solid #c5cae9;
               border-radius: 8px;
               font-size: 0.95rem;
               font-family: inherit;
               background: #f8fafc;
          }
          .search-box input:focus {
               outline: none;
               border-color: #3949ab;
               box-shadow: 0 0 0 3px rgba(57, 73, 171, 0.12);
          }
          .table-container {
               overflow-x: auto;
               border-radius: 10px;
               border: 1px solid #e2e8f0;
          }
          table {
               width: 100%;
               border-collapse: collapse;
               background: #fff;
          }
          th, td {
               padding: 11px 14px;
               text-align: right;
               border-bottom: 1px solid #e2e8f0;
               font-size: 0.9rem;
          }
          th {
               background: #f1f5f9;
               font-weight: 600;
               color: #334155;
          }
          .role-badge {
               padding: 3px 12px;
               border-radius: 20px;
               font-size: 0.78rem;
               font-weight: 500;
          }
          .role-admin { background: #b71c1c; color: white; }
          .role-teacher { background: #2e7d32; color: white; }
          .role-student { background: #1565c0; color: white; }
          .btn-icon { color: #3949ab; }
          .btn-delete { color: #dc2626; }
          .mdl-button {
               font-family: 'Vazirmatn', Tahoma, sans-serif;
               border-radius: 8px;
               font-weight: 600;
          }
          @media (max-width: 600px) {
               th, td { padding: 8px 10px; font-size: 0.82rem; }
               .mdl-card__supporting-text { padding: 16px; }
          }
     </style>
</head>
<body>
     <div class="mdl-grid">
          <div class="mdl-cell mdl-cell--12-col">
               <div class="mdl-card mdl-shadow--2dp">
                    <div class="mdl-card__title">
                         <p class="mdl-card__title-text" style="font-size: larger;">مدیریت کاربران</p>
                    </div>
                    <div class="mdl-card__supporting-text">
                         <div class="header-actions">
                         <span>تعداد کاربران: <strong id="user-count">0</strong></span>
                         </div>

                         <div class="search-box">
                         <input type="text" id="search-users" placeholder="جستجوی کاربر بر اساس نام یا ایمیل...">
                         </div>

                         <div class="table-container">
                         <table>
                              <thead>
                                   <tr>
                                        <th>#</th>
                                        <th>نام</th>
                                        <th>ایمیل</th>
                                        <th>نقش</th>
                                        <th>شماره دانشگاهی</th>
                                        <th>تاریخ ثبت</th>
                                        <th>عملیات</th>
                                   </tr>
                              </thead>
                              <tbody id="users-tbody">
                                   <tr><td colspan="7" style="text-align:center;">در حال بارگذاری...</td></tr>
                              </tbody>
                         </table>
                         </div>

                         <div style="margin-top: 18px;">
                         <a href="{{ base_url }}/dashboard" class="mdl-button mdl-js-button mdl-button--raised">بازگشت به داشبورد</a>
                         </div>
                    </div>
               </div>
          </div>
     </div>

     <div id="users-data" data-users='{{ users_json }}' data-base-url='{{ base_url }}'></div>

     <script>
          (function() {
               var dataElement = document.getElementById('users-data');
               var users = JSON.parse(dataElement.getAttribute('data-users') || '[]');
               var baseUrl = dataElement.getAttribute('data-base-url') || '';

               var roleLabels = {
                    'admin': 'مدیر',
                    'teacher': 'استاد',
                    'student': 'دانشجو'
               };
               var roleClasses = {
                    'admin': 'role-admin',
                    'teacher': 'role-teacher',
                    'student': 'role-student'
               };

               function renderUsers(userList) {
                    var tbody = document.getElementById('users-tbody');
                    if (!tbody) return;

                    if (!userList || userList.length === 0) {
                         tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#64748b;">هیچ کاربری یافت نشد</td></tr>';
                         document.getElementById('user-count').textContent = '0';
                         return;
                    }

                    document.getElementById('user-count').textContent = userList.length;

                    var html = '';
                    for (var i = 0; i < userList.length; i++) {
                         var u = userList[i];
                         var rowNum = i + 1;
                         var roleText = roleLabels[u.role] || u.role || 'نامشخص';
                         var roleClass = roleClasses[u.role] || '';

                         html += '<tr>';
                         html += '<td>' + rowNum + '</td>';
                         html += '<td>' + (u.fullname || '') + '</td>';
                         html += '<td>' + (u.email || '') + '</td>';
                         html += '<td><span class="role-badge ' + roleClass + '">' + roleText + '</span></td>';
                         html += '<td>' + (u.university_id || '—') + '</td>';
                         html += '<td>' + (u.created_at || '—') + '</td>';
                         html += '<td style="white-space:nowrap;">';
                         html += '<a href="' + baseUrl + '/user/' + u.id + '" class="mdl-button mdl-js-button mdl-button--icon btn-icon"><i class="material-icons">edit</i></a>';
                         html += '<form method="POST" action="' + baseUrl + '/user/delete/' + u.id + '" style="display:inline;" onsubmit="return confirm(\'آیا از حذف کاربر ' + (u.fullname || '') + ' اطمینان دارید؟\');">';
                         html += '<button type="submit" class="mdl-button mdl-js-button mdl-button--icon btn-delete"><i class="material-icons">delete</i></button>';
                         html += '</form>';
                         html += '</td>';
                         html += '</tr>';
                    }
                    tbody.innerHTML = html;

                    if (window.componentHandler) {
                         window.componentHandler.upgradeAllRegistered();
                    }
               }

               var searchInput = document.getElementById('search-users');
               if (searchInput) {
                    searchInput.addEventListener('input', function() {
                         var term = this.value.toLowerCase().trim();
                         if (!term) {
                         renderUsers(users);
                         return;
                         }
                         var filtered = users.filter(function(u) {
                         var name = (u.fullname || '').toLowerCase();
                         var email = (u.email || '').toLowerCase();
                         return name.includes(term) || email.includes(term);
                         });
                         renderUsers(filtered);
                    });
               }

               window.onload = function() {
                    renderUsers(users);
                    if (window.componentHandler) {
                         window.componentHandler.upgradeAllRegistered();
                    }
               };
          })();
     </script>
     <script defer src="https://cdnjs.cloudflare.com/ajax/libs/material-design-lite/1.3.0/material.min.js"></script>
</body>
</html>
