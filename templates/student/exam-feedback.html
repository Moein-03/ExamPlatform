<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>نتایج آزمون</title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/material-design-lite/1.3.0/material.indigo-pink.min.css">
     <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
     <style>
          * { box-sizing: border-box; margin: 0; padding: 0; }
          body {
               direction: rtl; text-align: right;
               font-family: 'Vazirmatn', Tahoma, sans-serif;
               background: linear-gradient(160deg, #eef2ff 0%, #f0f4f8 45%, #e8eaf6 100%);
               min-height: 100vh;
          }
          .mdl-card {
               max-width: 720px;
               margin: 0 auto;
               width: 100%;
               border-radius: 14px;
               overflow: hidden;
               box-shadow: 0 6px 24px rgba(26, 35, 126, 0.08);
               border: 1px solid rgba(99, 102, 241, 0.08);
          }
          .mdl-card__title {
               background: linear-gradient(90deg, #1a237e 0%, #283593 55%, #3949ab 100%);
               color: #fff;
               padding: 16px 22px;
          }
          .mdl-card__title-text { font-size: 1.25rem; font-weight: 600; }
          .mdl-card__supporting-text {
               padding: 22px 24px;
               color: #1e293b;
          }
          .score-number {
               font-size: 2.2rem;
               color: #1a237e;
               font-weight: 700;
          }
          .status-passed { color: #047857; font-size: 1.3rem; font-weight: 600; }
          .status-failed { color: #b91c1c; font-size: 1.3rem; font-weight: 600; }
          .stat-box {
               padding: 16px 12px;
               text-align: center;
               background: #f8fafc;
               border-radius: 10px;
               height: 100%;
               border: 1px solid #e2e8f0;
          }
          .info-row {
               display: flex;
               padding: 10px 0;
               border-bottom: 1px solid #e2e8f0;
               font-size: 0.95rem;
          }
          .info-label {
               width: 120px;
               font-weight: 600;
               color: #475569;
               flex-shrink: 0;
          }
          .info-value { flex: 1; }
          .mdl-button {
               font-family: 'Vazirmatn', Tahoma, sans-serif;
               border-radius: 8px;
               font-weight: 600;
          }
          @media (max-width: 600px) {
               .info-row { flex-direction: column; gap: 2px; }
               .info-label { width: 100%; }
          }
     </style>
</head>
<body>
     <div class="mdl-grid">
          <div class="mdl-cell mdl-cell--12-col">
               <div class="mdl-card mdl-shadow--2dp">
                    <div class="mdl-card__title">
                         <p class="mdl-card__title-text">نتایج آزمون</p>
                    </div>
                    <div class="mdl-card__supporting-text">
                         <div id="student-info"></div>
                         <div class="mdl-grid" id="stats-container" style="margin-top:18px;"></div>
                         <div style="margin-top: 22px;">
                         <a href="{{ base_url }}/exams" class="mdl-button mdl-js-button mdl-button--raised">بازگشت به لیست</a>
                         </div>
                    </div>
               </div>
          </div>
     </div>

     <div id="exam-data" 
          data-feedback='{{ feedback_json }}' 
          data-stats='{{ stats_json }}'
          data-base-url='{{ base_url }}'>
     </div>

     <script>
          (function() {
               var dataElement = document.getElementById('exam-data');
               var feedback = JSON.parse(dataElement.getAttribute('data-feedback') || '{}');
               var stats = JSON.parse(dataElement.getAttribute('data-stats') || '{}');
               var baseUrl = dataElement.getAttribute('data-base-url') || '';

               function renderStudentInfo() {
                    var container = document.getElementById('student-info');
                    if (!container) return;
                    if (!feedback || !feedback.fullname) {
                         container.innerHTML = '<p style="color:#64748b;">اطلاعاتی یافت نشد.</p>';
                         return;
                    }
                    var html = '';
                    html += '<div class="info-row"><span class="info-label">نام:</span><span class="info-value">' + (feedback.fullname || '') + '</span></div>';
                    html += '<div class="info-row"><span class="info-label">ایمیل:</span><span class="info-value">' + (feedback.email || '') + '</span></div>';
                    html += '<div class="info-row"><span class="info-label">نمره:</span><span class="info-value"><span class="score-number">' + (feedback.score || 0) + '</span></span></div>';
                    html += '<div class="info-row"><span class="info-label">وضعیت:</span><span class="info-value"><span class="' + (feedback.passed ? 'status-passed' : 'status-failed') + '">' + (feedback.passed ? 'قبول' : 'مردود') + '</span></span></div>';
                    container.innerHTML = html;
               }

               function renderStats() {
                    var container = document.getElementById('stats-container');
                    if (!container) return;
                    var html = '';

                    html += '<div class="mdl-cell mdl-cell--4-col">';
                    html += '<div class="stat-box">';
                    html += '<p style="margin:0 0 6px;font-size:0.9rem;color:#64748b;">تعداد شرکت‌کنندگان</p>';
                    html += '<p style="font-size:1.6rem;font-weight:700;color:#1a237e;margin:0;">' + (stats.total_participants || 0) + '</p>';
                    html += '</div></div>';

                    html += '<div class="mdl-cell mdl-cell--4-col">';
                    html += '<div class="stat-box">';
                    html += '<p style="margin:0 0 6px;font-size:0.9rem;color:#64748b;">میانگین نمرات</p>';
                    html += '<p style="font-size:1.6rem;font-weight:700;color:#1a237e;margin:0;">' + (stats.avg_score || 0) + '</p>';
                    html += '</div></div>';

                    html += '<div class="mdl-cell mdl-cell--4-col">';
                    html += '<div class="stat-box">';
                    html += '<p style="margin:0 0 6px;font-size:0.9rem;color:#64748b;">بالاترین / پایین‌ترین</p>';
                    html += '<p style="font-size:1.2rem;font-weight:600;color:#1a237e;margin:0;">' + (stats.max_score || 0) + ' / ' + (stats.min_score || 0) + '</p>';
                    html += '</div></div>';

                    container.innerHTML = html;
               }

               window.onload = function() {
                    renderStudentInfo();
                    renderStats();
                    if (window.componentHandler) {
                         window.componentHandler.upgradeAllRegistered();
                    }
               };
          })();
     </script>
     <script defer src="https://cdnjs.cloudflare.com/ajax/libs/material-design-lite/1.3.0/material.min.js"></script>
</body>
</html>
